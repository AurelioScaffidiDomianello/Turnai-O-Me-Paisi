à. Questo libro è nato così, tra le corsie d'ospedale e la mia abitazione di Piraino centro dove ho sempre vissuto. Non l'ho scritto per cercare compassione, ma perché scrivere mi ha tenuto la mano quando la mano non aveva forza. Vivo con mia moglie Elisa, presenza discreta e solida che mi accompagna da una vita, e ho una figlia, Alessia, che è la mia luce e il mio orgoglio più grande. Accanto a loro, tra una flebo e una finestra aperta sul paese, ho trovato il coraggio di mettere in fila queste pagine. Il protagonista che incontrerete, Turi Lamonica, è personaggio di fantasia, di Piraino centro: è impastato con la stoffa buona della nostra gente, ma la voce che lo racconta è la mia.", "Piraino di luglio 2026, quello vero di oggi. È più nudo, più vero, e per questo più amato. Piraino luglio 2026 reale, paese curato, Eolie nitide sullo sfondo. Oltre la guardiola, i turisti proseguono fino a piazza Rosario, dove c'è l'unico bar di Piraino, quello dei fratelli Diego e Rosario Di Giorgio, per gustare una granita o il gelato buonissimo artigianale fatto dai fratelli Di Giorgio. Fa caldo, un caldo fermo che alle due del pomeriggio inchioda le pietre e fa vibrare l'aria sopra i tetti. Le case di Piraino centro sono lì, aggrappate una all'altra, intonaci chiari, persiane socchiuse, qualche balcone fiorito e molti silenzi. Di turisti ce ne sono pochi, ma ci sono, con macchine con targa straniera che si fermano al belvedere per una foto, passi lenti che cercano ombra. Non c'è confusione, c'è rispetto. Il paese trattiene il fiato nelle ore centrali, poi respira la sera, quando escono due sedie fuori dalle porte di pietra e qualcuno parla piano. Le Eolie, quando l'aria è pulita, si vedono davvero: Vulcano e Salina come segni di matita sul mare, Stromboli la sera con il suo lume lontano. La Torre Saracena che guarda il mare è lì, immobile, e il cuore antico di Piraino centro, dove ho sempre vissuto tra ospedale e casa, è ancora vivo, non per rumore ma per fedeltà.", 'Questo mio primo scritto lo dedico ai miei genitori, con una gratitudine che nessuna parola basta a dire. Mia madre Caterina morta nel 2012 a 84 anni conosciuta a Piraino come "Ina a mugghiere di Don Giacomimo", mio padre Giacomo detto Don Giacomino postino a Fiumara di Piraino, Gliaca, Salinà, Leomandri morto a 69 anni a Piraino nel 1993. Mia madre Caterina conosciuta per "Ina a mugghiere di Don Giacomimo" aveva mani che non stavano mai ferme, mani che rammendavano, impastavano, accarezzavano e sgridavano con lo stesso amore. Custodiva la casa come si custodisce un altare povero, e noi quattro figli siamo cresciuti dentro quel profumo di pulito, di pane, di rosario detto piano la sera sul divano. Mio padre Giacomo detto Don Giacomino non faceva solo il postino, faceva una missione di gambe e di coscienza. Ogni giorno, sotto il sole che spaccava le pietre e sotto la pioggia che rendeva scivolosi i sentieri, partiva con la borsa di cuoio a tracolla per Fiumara di Piraino, per Gliaca, per Salinà, per Leomandri. Conosceva ogni curva, ogni cane, ogni nome dietro ogni porta.', "Portava lettere d'America, cartoline sgualcite, pensioni, notizie che cambiavano la giornata. Non consegnava solo buste, consegnava destini. Tornava a casa la sera con le scarpe impolverate, la schiena piegata, e mai una lamentela. Con quel poco, con quello stipendio di postino che doveva bastare per sei bocche, lui e mia madre Caterina hanno fatto il miracolo più grande: hanno cresciuto, educato e fatto studiare quattro figli, senza farci mai sentire poveri d'amore. Ci hanno insegnato che la dignità non è nei soldi ma nel modo in cui ti presenti al mondo, con rispetto, con parola data, con lavoro fatto bene. Se oggi io, Aurelio, a sessantasei anni, trovo la forza di scrivere tra ospedale e casa di Piraino centro dove ho sempre vissuto, è perché ho avuto la loro schiena come modello e le loro mani come benedizione. A voi, Caterina e Giacomo detto Don Giacomino, dedico questo libro. Piraino, luglio 2026 — Aurelio Scaffidi Domianello."]}, {roman: "II", title: "La partenza — Da Piraino centro a Gliaca", paragraphs: ["Era il 1920, primavera del 1920, alba del 1920 a Piraino centro. Quella mattina Turi Lamonica si svegliò prima che il gallo di Piraino centro cantasse. Aveva ventidue anni, le mani già indurite dai limoni, e una valigia di cartone legata con lo spago che sua madre aveva preparato la sera prima piangendo in silenzio. Nella cucina di pietra, bassa e scura, c'era odore di caffè d'orzo e di pane raffermo. Fuori, il buio era ancora compatto, ma dalle fessure delle persiane filtrava già l'odore di rugiada e di pietra bagnata che solo Piraino centro sa dare. Piraino anni Venti era così: vicoli di pietra stretti, silenzio rotto solo dalle campane della Chiesa Madre.", "Piraino anni Venti era un altro mondo, e quella mattina lo rivide tutto in un lampo: vicoli di pietra stretti e lavati dalla rugiada, donne con le brocche di rame in testa che andavano alla fontana, muli carichi di legna legati davanti alle porte basse, la Torre Saracena intatta e fiera che guardava il mare senza un graffio, il profumo di pane appena sfornato che usciva dai forni di pietra, la Chiesa Madre lassù con il rosone ancora scuro e le campane pronte. Un silenzio rotto solo dalle campane. Uscì senza far rumore. Non voleva svegliare nessuno, anche se sapeva che dietro le porte socchiuse del vicolo, le donne di Piraino centro erano già sveglie e pregavano per lui. L'ultima occhiata la diede alla Torre Saracena che guarda il mare. Stava lì, nera contro il cielo che schiariva, immobile come una sentinella che non dorme mai. Turi la salutò con la mano, come si saluta un padre. Turiddu, dissi a me stesso, ricordati che quella pietra ti guarda sempre, ovunque vai.", "La discesa verso Gliaca la fece a piedi, conosceva quella strada a memoria, l'aveva fatta mille volte da ragazzo per andare al mare e ai limoneti. Aveva percorso quella mulattiera sotto il sole e sotto la pioggia, conosceva ogni pietra, ogni scorciatoia, ogni ulivo. Solo che stavolta non tornava a pranzo. La mulattiera era scivolosa, piena di pietre smosse dall'inverno. La valigia di cartone pesava poco: due camicie stirate da sua madre, un paio di mutande, una foto ingiallita davanti alla Chiesa Madre di Piraino centro, un pezzo di caciocavallo avvolto nella carta oleata e un santino della Madonna del Mare piegato in quattro.", "Arrivò alla Stazione di Gliaca di Piraino con il fiatone e le scarpe impolverate. Era una stazioncina gialla, piccola, con l'intonaco scrostato e il capostazione che fumava seduto fuori, con le gambe incrociate. Sul binario c'erano già tre o quattro uomini come lui, con le stesse valigie legate con lo spago, con lo stesso sguardo perso tra Piraino centro lassù aggrappato alla collina e il mare giù che prometteva America. Nessuno parlava. Si sentiva solo il mare e il fischio lontano di un treno che non si vedeva ancora.", "Quando il treno a vapore arrivò sbuffando alla Stazione di Gliaca di Piraino, Turi Lamonica sentì le gambe farsi molli. Il fumo nero gli entrò negli occhi, gli bruciò la gola. Un uomo gridò: Turi, scrivi! Era Zio Peppe di Piraino centro. Turi annuì, salì sul predellino di ferro rovente, si voltò. Lassù, Piraino centro sembrava un presepe di pietra, con la Chiesa Madre e la Torre Saracena che guarda il mare. La campana suonò le sei, ma lui non la sentì più, coperta dal fischio del treno. Disse piano, in siciliano: Matri mia, turnu prestu. Poi il treno partì.", "Il vagone era di terza classe, legno duro, odore di carbone e di sudore vecchio. Turi si sedette vicino al finestrino, la valigia sulle ginocchia, e non ebbe il coraggio di guardare più fuori fino a Capo d'Orlando. Quando finalmente lo fece, Piraino centro era scomparso dietro una curva. Era il 1920 e stava lasciando tutto. Solo allora pianse, senza vergogna, con la faccia contro il vetro sporco, mentre il treno correva verso Palermo e l'America, lasciando dietro le case di pietra dove era nato."]}, {roman: "III", title: "Gliaca — Palermo", paragraphs: ["Il treno da Gliaca a Palermo ci mise quasi un giorno intero, fermandosi ad ogni stazione come un mulo stanco. Era il 1920, primavera del 1920. Turi Lamonica guardava dal finestrino i limoneti che scorrevano, poi le montagne, poi il mare che a volte spariva e poi tornava, sempre più grande. Accanto a lui si sedette un vecchio di Brolo che andava a trovare un figlio a Palermo e che gli offrì olive nere e pane. Turiddu, unni vai accussì luntanu? gli chiese. E Turi, con vergogna: In America, zio. A New Jork.", "Il vagone si riempiva e si svuotava di gente di tutti i paesi: di Piraino, di Ficarra, di Sinagra, di Sant'Angelo. Ognuno aveva una storia uguale e diversa. Una donna con tre bambini cantava una ninna nanna per non farli piangere. Due giovani di Naso discutevano di quanti dollari si guadagnava a fare il lavapiatti. Turi ascoltava, stringendo la sua valigia di cartone, e sentiva che Piraino centro si allontanava chilometro dopo chilometro, ma gli restava attaccato sotto la pelle come la salsedine.", "Il treno sferragliava verso Palermo, lungo la costa, tra gallerie scavate nella roccia e piccoli paesi che sfilavano lenti. Turi guardava dal finestrino i campi e gli ulivi che diventavano più radi, poi le case più fitte. Pensò alla Torre Saracena che guarda il mare e si disse che anche quella torre guardava lo stesso mare, ma da Piraino centro sembrava più buono. Comprò una gazzosa con le ultime lire che sua madre gli aveva messo in mano davanti al portone di pietra del centro e la bevve in un sorso.", "L'arrivo a Palermo fu un colpo nello stomaco. Stazione affollata, urla, facchini, odore di pesce marcio e di carbone, gente che spingeva. Turi Lamonica, abituato ai vicoli silenziosi di Piraino centro dove ogni faccia ha un nome, si sentì perso come un agnello al mercato. Teneva la valigia stretta al petto e camminava guardando in alto per non perdersi. Un uomo gli gridò: O paisà, attento che a Palermo ti rubano pure l'ombra! Ma Turi non si fermò, aveva l'indirizzo del porto scritto su un pezzetto di carta da sua madre.", "Il porto di Palermo era un inferno bellissimo. Navi enormi, gru, casse di limoni, marinai ubriachi, donne che vendevano panelle, bambini scalzi che correvano. E in mezzo, centinaia di emigranti come lui, con le stesse valigie legate con lo spago, seduti per terra ad aspettare la nave per l'America. Turi si sedette anche lui, appoggiò la schiena a un muro di pietra, aprì la valigia e guardò la foto di Piraino centro. Poi la richiuse. Domani si partiva per davvero, verso New Jork. Era il 1920 e sentì per la prima volta che la paura era più grande della speranza."]}, {roman: "IV", title: "Palermo — New York — Quindici giorni di mare", paragraphs: ["La nave si chiamava Saturnia, ma per Turi Lamonica poteva chiamarsi paura. Era alta come la Chiesa Madre di Piraino centro messa in verticale, nera e rossa, con un fumo che sporcava il cielo di Palermo. Era il 1920. Salì a bordo con altri trecento siciliani, tutti con la valigia di cartone, tutti con lo sguardo di chi non sa se tornerà. Gli diedero un numero appeso al collo e un posto in stiva, dove l'aria non entrava e l'odore di vomito era già presente prima ancora di partire.", "I primi due giorni furono quasi belli. Turi usciva sul ponte e guardava il mare, che era liscio come l'olio di Piraino centro. Conobbe Carmelo di Ficarra, che suonava la fisarmonica e che gli disse: Turiddu, io vado da mi sorella a Brooklyn, se hai bisogno, cerca Maria, mia cugina, è di Ficarra pure idda, bona carusa. Maria di Ficarra. Turi si mise quel nome in testa come una preghiera.", "Il terzo giorno arrivò la tempesta. Non una tempesta come quelle che a Piraino centro facevano tremare le persiane di pietra, ma una cosa dell'altro mondo. Onde alte come case di Piraino centro, la nave che saliva e poi cadeva giù, giù, come se volesse andare a trovare i morti. Tutti vomitavano, anche i marinai. Turi vomitò l'anima, poi rimase aggrappato alla branda, pregando la Madonna del Mare e la SS Ecce Homo di Piraino centro.", "Carmelo di Ficarra, per tirargli su il morale, prese la fisarmonica anche con la nave che ballava e suonò una tarantella storta. Qualcuno rise, qualcuno pianse, una vecchia di Piraino iniziò a dire il rosario ad alta voce e tutti le andarono dietro. In quel momento, in mezzo all'Atlantico, Turi capì che Piraino centro non era un posto, era quella gente lì, stretta insieme nella stiva, che pregava in siciliano.", "Dopo sei giorni di tempesta, il mare si calmò all'improvviso. Turi uscì sul ponte all'alba e vide solo acqua, acqua ovunque, senza una torre, senza una casa di pietra, senza la Torre Saracena che guarda il mare. Si sentì più solo che mai. Ma Carmelo gli diede una pacca: Dumani, dopodomani, vidi a Miss Liberty, e ti scordi tutto, Turiddu.", "Gli ultimi giorni furono di attesa febbrile. Tutti lavavano la camicia buona, si pettinavano, si raccontavano cosa avrebbero fatto in America. Turi diceva poco. Pensava a Piraino centro, alle sue pietre, al suo pane, e a Maria di Ficarra che non conosceva ancora ma che già immaginava con le trecce nere come le donne del suo paese.", "Il quindicesimo giorno, all'alba, un grido svegliò tutta la stiva: A MERICA! Turi corse sul ponte con la valigia di cartone legata con lo spago e la vide. La Statua della Libertà. Non era come nelle foto del bar di Piraino centro, era molto più grande, e sembrava guardarlo solo lui. Turi Lamonica, di Piraino centro, partito nel 1920, con le ginocchia che tremavano, si mise a piangere e disse forte: Turiddu, ci sì, ci arrivasti.", "Ellis Island fu un altro inferno di attesa. Medici che ti guardavano gli occhi, domande in inglese che non capiva, timbri, file infinite. Quando finalmente gli misero il timbro sul foglio e gli dissero okay, go, Turi uscì fuori, a Manhattan, con la sua valigia di cartone, e cercò il cielo per vedere se si vedevano le Eolie. Non si vedevano. C'erano solo palazzi alti come montagne di pietra. Ma giurò che avrebbe costruito la sua casa, pietra su pietra, con pazienza."]}, {roman: "V", title: "Trent'anni in America — Maria di Ficarra e i tre figli — 1920-1950", paragraphs: ["I primi mesi a New York, Turi Lamonica li passò come dentro un sogno di cemento. Era il 1920, estate del 1920. Dormiva in una stanza a Mulberry Street con altri quattro di Piraino e di Ficarra, lavorava come manovale a scaricare mattoni a Brooklyn per un capomastro calabrese che urlava solo: più veloce, paesà! La sera aveva le mani sanguinanti, la schiena rotta, ma contava i dollari nella scatola di latta sotto il letto e pensava a Piraino centro e a quel nome: Maria di Ficarra.", "La conobbe una domenica di ottobre del 1921, alla festa di San Cono a Brooklyn, nella chiesa di Santo Stefano. Carmelo gliela presentò: Maria, di Ficarra, figlia di Totò u zuccataru. Era piccola, con i capelli neri legati, occhi furbi, mani rosse di chi lavora. Aveva vent'anni ed era arrivata da Ficarra un anno prima. Parlava siciliano stretto e rideva forte. Turi la guardò e capì che quella era la sua America. Ci vuoi ballare? le chiese. E lei: Si, ma se mi pesti i piedi ti sparo, come si fa a Ficarra.", "Si sposarono sei mesi dopo, il 12 aprile 1922, nella stessa chiesa italiana di Brooklyn, con un pranzo di quaranta persone in una cantina di Bensonhurst, con vino fatto da suo suocero di Ficarra e salsiccia portata da Piraino centro da un cugino appena arrivato. Maria indossava un vestito bianco cucito dalla zia, Turi un vestito blu preso a credito. Quando il prete disse: vuoi tu Maria di Ficarra prendere Turi Lamonica di Piraino centro?, Maria disse sì forte, che si sentì fino a Piraino. E Turi pianse, perché per la prima volta da quando aveva lasciato la Stazione di Gliaca di Piraino nel 1920 non si sentiva più solo.", "Il lavoro di Turi in America fu la muratura. Iniziò come manovale, poi muratore, poi capomastro. Aveva le mani di Piraino centro, abituate alla pietra, e gli americani si fidavano. Turiddu sa fare le cose dritte, dicevano. Costruiva palazzine di tre piani nel Queens, villette a Long Island, muri di contenimento. Si alzava alle cinque del mattino, anche d'inverno con la neve, beveva caffè nero, mangiava pane e mortadella e andava in cantiere. La sera tornava con la tuta bianca di calce, come un fantasma di Piraino centro.", "Le giornate di Turi e Maria in America avevano un ritmo di rosario. Sveglia alle cinque, cantiere per lui, fabbrica di camicie per lei fino al 1930, poi casa. La domenica era sacra: messa alle nove nella chiesa italiana, con tutti i paesani di Piraino e di Ficarra, poi pranzo con pasta al forno, poi bocce nel parcheggio dietro la chiesa. L'hobby di Turi era l'orto sul tetto del palazzo di Bensonhurst: pomodori, basilico, peperoncini. Quando i pomodori diventavano rossi, li guardava e diceva: tali e quali a chiddi di Piraino centro, ma cchiù tristi.", "Un altro hobby era il vino in cantina. Ogni settembre, con i compari di Ficarra e di Piraino, compravano uva di California e facevano vino in un garage, pestando a piedi nudi come a Piraino centro. Veniva un vino aspro, forte, che pizzicava la lingua, ma era il loro vino. Lo bevevano a Natale, a Pasqua, e Turi diceva sempre: Alla Torre Saracena che guarda il mare, che ci guarda pure da qua!", "Il 3 febbraio 1924 nacque il primo figlio, e lo chiamarono ANTONINO, Antonino Lamonica. Turi volle un nome forte, di famiglia ma non di confusione. Antonino era un bambino serio, con gli occhi grandi di Maria di Ficarra e la testa dura di Piraino centro. A tre anni già diceva: papà, voglio costruire case come te. Maria lo sgridava: prima studia, poi costruisci. E Antonino studiava davvero, il primo della classe.", "Antonino crebbe tra libri e cantieri. A scuola era il primo, parlava inglese senza accento, ma a casa parlava siciliano con Turi. Papà, mi insegni a fare il nodo delle corde? Turi gli insegnava. A diciotto anni vinse una borsa di studio per legge alla Columbia University. Turi, il muratore di Piraino centro partito nel 1920, andò alla laurea con il vestito buono e pianse tutto il tempo. Oggi Antonino è avvocato a Manhattan, sposato con Jennifer, irlandese cattolica, due figli: Anthony e Sofia, che chiamano Turi nonno Joe e che ogni estate vogliono sentire la storia della Stazione di Gliaca di Piraino del 1920.", "La seconda figlia arrivò il 14 agosto 1927, sotto Ferragosto, e la chiamarono ROSA, Rosa Lamonica. Rosa era tutta sua madre: testarda, dolce, con le mani che impastavano già a otto anni. A scuola voleva fare l'insegnante, e guai a chi le diceva di no. Diceva: io insegno ai bambini americani come si fa la pasta a mano, come si faceva a Piraino centro. E lo fece davvero, maestra elementare a Queens, sposata con Patrick O'Brien, irlandese, insegnante di storia, due figli: Michael e Anna.", "Rosa è quella che tiene la famiglia unita. Ogni Natale fa venire tutti a casa sua e fa le cucciddati con fichi e mandorle come si facevano una volta a Piraino centro. Suo marito Patrick ha imparato a dire: mancia, mancia, bedda matri! e i bambini ridono. Rosa parla spesso di Piraino centro ai suoi alunni americani, mostra la foto della Torre Saracena che guarda il mare e dice: quello è il posto di mio padre, dove le pietre parlano.", "Il terzo figlio, Giuseppe detto Peppino, nacque il 22 novembre 1932, in un'America tra crisi e speranza. Lo chiamarono Giuseppe, Peppino per tutti, perché Turi disse: questo ci salva dalla vecchiaia. Peppino era diverso: non voleva studiare, voleva motori. A dodici anni smontava la bicicletta e la rimontava al contrario. Turi si arrabbiava: studia, come Antonino! Ma Maria di Ficarra, saggia come le donne di Ficarra, diceva: lassalo fari, ogni figghiu avi a so strada.", "Peppino aprì a vent'anni un'officina meccanica a Brooklyn, Peppino's Garage, dove riparava macchine americane grosse come barche. Era bravo, onesto, con le mani nere di grasso come Turi le aveva di calce. Sposò Lisa, figlia di napoletani, parrucchiera, ragazza sveglia e buona. Hanno un figlio, Joseph, detto Jo-Jo, che ha le mani di suo nonno Turi e che già a dieci anni vuole fare il meccanico. Peppino è quello che chiamava Turi ogni domenica: Papà, come stai? Quando torni a Piraino centro mi porti?", "Le feste a casa Lamonica in America erano un pezzo di Piraino centro trapiantato nel Queens. A Natale, Maria di Ficarra faceva tre giorni di cucina: caponata, anelletti al forno, baccalà, cannoli. Turi metteva la fisarmonica di Carmelo di Ficarra e suonava, stonato ma felice. I figli Antonino, Rosa e Peppino, le nuore, i generi, i nipoti, tutti stretti in un appartamento piccolo, con odore di ragù e di nostalgia. E alla fine, Turi si alzava, con il bicchiere di vino di cantina, e diceva: A Piraino centro! E tutti: A Piraino centro!", "D'estate andavano a Coney Island, al mare, perché Turi voleva vedere il mare. Si sedeva sulla spiaggia con Maria di Ficarra, guardava l'Atlantico e diceva: questo non è il nostro mare, Maria. Il nostro è quello che si vede dalla Torre Saracena che guarda il mare, con le Eolie davanti. E Maria, che di Ficarra conosceva lo stesso mare, gli stringeva la mano e diceva: Turiddu, un giorno ci torniamo.", "Trent'anni passarono così, dal 1920 al 1950, mattone dopo mattone, figlio dopo figlio, messa dopo messa. Turi Lamonica da muratore divenne capomastro rispettato, con una piccola impresa: Lamonica & Sons Construction - Antonino, Rosa e Peppino. Costruì più di quaranta case, e ogni volta che metteva l'ultima pietra, pensava alla casa di pietra di Piraino centro dove era nato. Aveva i capelli bianchi, la schiena curva, ma le mani ancora forti. E ogni sera, prima di dormire, guardava la foto sbiadita di Piraino - anno partenza 1920, quella che ora sta sulla copertina di questo libro, e diceva piano: ancora picca, paisi miu."]}, {roman: "VI", title: "Nostalgia e ritorno — Onde gigantesche — 1950", paragraphs: ["La nostalgia arrivò a Turi Lamonica non tutta insieme, ma a gocce, come l'acqua che entra nelle scarpe a Piraino centro d'inverno. Prima fu l'odore: un giorno al mercato di Brooklyn sentì odore di limoni di Sicilia e gli venne da piangere davanti alla bancarella. Poi fu il suono: le campane della chiesa italiana la domenica gli ricordavano quelle della Chiesa Madre di Piraino centro, ma più tristi. Poi furono i sogni: sognava ogni notte la Torre Saracena che guarda il mare, e si svegliava con la faccia bagnata.", "Aveva cinquantadue anni, nel 1950, trent'anni dopo quel 1920, quando disse a Maria di Ficarra: Maria, io torno. Maria lo guardò, lei che di Ficarra aveva lo stesso mare e la stessa pietra dentro, e capì. Da trent'anni, dal 1920, lo vedeva guardare verso est, oltre i palazzi del Queens, cercare Piraino centro dove non c'era. Turiddu, ci pensu da anni pure io, disse. Ma i figli? E la casa? E Turi: Antonino, Rosa e Peppino restano qua, è giusto, è America. Ma noi due, Maria, torniamo a morire dove siamo nati, tra le pietre nostre.", "Fu una decisione lunga un anno. Antonino l'avvocato disse: papà, sei sicuro? Lì non c'è ospedale buono. Rosa pianse: papà, chi mi fa le cucciddati a Natale? Peppino disse solo: papà, ti aggiusto la macchina per l'ultimo viaggio. Maria di Ficarra alla fine accettò, a patto di portare con sé la macchina per fare la pasta e la foto dei nipoti. Vendettero la piccola impresa, lasciarono l'appartamento di Bensonhurst a Peppino e comprarono due biglietti di nave, non di aereo. Turi volle la nave: voglio tornare come sono partito nel 1920, dal mare.", "Il viaggio di ritorno fu più duro dell'andata. Partirono da New York a fine ottobre 1950, su una nave grande, la Saturnia del ritorno, che sembrava sicura. Ma a metà Atlantico li prese una tempesta che Turi non aveva mai visto nemmeno nel 1920. Onde gigantesche, alte come la Chiesa Madre di Piraino centro, che si abbattevano sul ponte e facevano urlare le lamiere. La nave saliva su, su, poi cadeva giù in un buco nero d'acqua. Maria di Ficarra stava male, vomitava, pregava. Fu allora che Turi capì che il ritorno sarebbe costato quanto la partenza.", "Turi, aggrappato alla branda, con la valigia di cartone nuova ma legata sempre con lo spago per scaramanzia, pregava la Madonna del Mare e la SS Ecce Homo di Piraino centro. Madonna mia, non mi fare morire ora che torno al mio paese! gridava, mentre le onde gigantesche facevano ballare la nave come un guscio di noce. Un marinaio gli disse: signore, è normale, passa. Ma Turi non ci credeva, aveva visto mare grosso da ragazzo sulle barche dei pescatori di Gliaca e non aveva mai visto onde così alte, un mare che sembrava volesse inghiottire tutto.", "La tempesta durò tre giorni e tre notti. Tre giorni in cui Turi e Maria di Ficarra non mangiarono, non dormirono, pregarono. Maria diceva: Turiddu, se moriamo, moriamo insieme, come ci siamo sposati. E Turi: no, Maria, non moriamo, la Torre Saracena che guarda il mare ci sta aspettando. Alla fine, la mattina del quarto giorno, il mare si calmò di colpo e si vide il sole. Turi uscì sul ponte, bianco come un morto, e vide lontano, nella nebbia, una costa. Era l'Italia. Era tornato.", "Quando sbarcarono a Palermo, Turi si inginocchiò per terra e baciò la banchina, come aveva visto fare a suo nonno quando tornava da militare. Un doganiere lo guardò strano, ma Turi non gli badò. Prese la mano di Maria di Ficarra e disse: Maria, turnammu. Siamo tornati. Presero il treno per Piraino, e quando arrivarono alla Stazione di Gliaca di Piraino, la stessa stazioncina gialla di trent'anni prima, del 1920, Turi pianse di nuovo, ma stavolta di gioia. Piraino centro era lassù, con la Torre Saracena che guarda il mare, e lo aspettava."]}, {roman: "VII", title: "Trentacinque anni a Piraino — Il custode e l'orologiaio — 1950-1985", paragraphs: ["Tornare a Piraino centro nel 1950, dopo trent'anni di America dal 1920, fu per Turi Lamonica come rientrare in una scarpa vecchia che ti sei portato dietro per tutta la vita. La casa di pietra dei suoi genitori era ancora lì, nel vicolo più stretto del centro, con le persiane chiuse e l'odore di chiuso e di ricordi. La ristrutturò con le sue mani di capomastro americano: riface il tetto, mise il bagno dentro, imbiancò le pietre. Maria di Ficarra pulì tutto, mise le tendine ricamate che aveva portato da Brooklyn e piantò basilico sul balcone di pietra. E così ricominciarono.", "Il lavoro che Turi inventò al ritorno fu doppio, come doppia era la sua vita. La mattina faceva il custode del cimitero del convento, appena fuori dal centro di pietra, dove c'erano i suoi vecchi e tutti i nomi che conosceva da ragazzo. Apriva il cancello alle sette, falciava l'erba, puliva le lapidi, parlava con i morti. O paisà, comu stai? diceva a Don Peppino il barbiere. E i morti, a Piraino centro, rispondono, se li sai ascoltare.", "Il pomeriggio, nella botteguccia sotto casa, faceva il riparatore di orologi e di piccole cose. Aveva imparato in America che nulla si butta, e a Piraino centro la gente gli portava sveglie rotte, orologi fermi, tostapane, sedie sgangherate. Turi li aggiustava con pazienza, come aggiustava le reti da ragazzo. Sulla porta aveva scritto a mano: Turi Lamonica — Riparazioni — Piraino centro. E sotto, più piccolo: Si aggiusta tutto, tranne il tempo perso. La gente rideva e entrava.", "Le giornate di Turi a Piraino centro avevano un ritmo antico e nuovo insieme. Sveglia alle sei, caffè con Maria di Ficarra, poi cimitero. Alle dieci scendeva al bar di Piazza Rosario, giocava a tressette con gli anziani del centro, gli stessi con cui giocava da ragazzo nel 1920, solo più vecchi, con le stesse mani di pietra. Battevano le carte sul tavolino di plastica con quel colpo secco che era musica per Piraino centro. Turiddu, quantu tempu! gli dicevano. E lui: trent'anni d'America, ma mi pare ieri.", "A mezzogiorno andava a messa alla Chiesa Madre, poi pranzo con Maria di Ficarra: pasta con le sarde, involtini, pane di Piraino centro che finalmente sapeva di pietra e ulivo come quello di una volta. Il pomeriggio, nella bottega, riparava orologi e ascoltava la radio. La sera, d'estate, metteva due sedie fuori dalla porta di pietra, come si faceva una volta, e guardava le Eolie che al tramonto diventavano oro fuso. La Torre Saracena che guarda il mare era lì, a due passi, e finalmente poteva guardarla ogni giorno.", "Maria di Ficarra si trovò bene a Piraino centro, anche se all'inizio le mancava Brooklyn. Aprì un piccolo orto dietro casa, con pomodori, zucchine, melanzane, e faceva conserve per tutto l'inverno. Le donne del centro andavano da lei per imparare come si faceva il cheesecake americano e lei insegnava, ma poi imparava da loro come si fanno i vastasati. Diceva: a Ficarra e a Piraino centro si cucina uguale, cambia solo il vento. E aveva ragione.", "L'estate era il momento più bello. A luglio e agosto arrivavano i figli dall'America con i nipoti. Antonino l'avvocato con Jennifer e i suoi due figli americani che parlavano mezzo inglese e mezzo siciliano, Rosa con Patrick e i bambini che volevano andare alla Torre Saracena che guarda il mare tutti i giorni, Peppino con Lisa e Jo-Jo che aiutava Turi in bottega a riparare orologi. La casa di pietra di Piraino centro scoppiava di voci, di risate, di odore di ragù americano-siciliano.", "Turi portava i nipoti a vedere gli ulivi sopra Piraino centro, quelli che suo padre e suo nonno avevano piantato pietra dopo pietra. Li faceva salire sulla Torre Saracena che guarda il mare e diceva: vedete, da qua si vede l'America, se avete occhi buoni. E i nipoti ridevano, ma poi guardavano davvero, cercando New York oltre le Eolie. E Turi raccontava la storia della Stazione di Gliaca di Piraino del 1920, del treno a vapore, della nave con le onde gigantesche del ritorno del 1950, e i nipoti ascoltavano con la bocca aperta, come si ascoltano le favole vere.", "Con i soldi dell'America, Turi comprò un piccolo terreno di limoni sopra Gliaca, proprio sotto Piraino centro. Lo coltivava la mattina presto, prima del cimitero, come faceva da ragazzo prima del 1920. I limoni di Piraino centro erano grossi, con la buccia spessa e profumata, gialli come l'oro della copertina di questo libro. Li raccoglieva con le mani nude, attento alle spine, e li portava al mercato di Piraino centro. La gente diceva: Turi, sono i limoni più buoni, si sente che li hai fatti con mani d'America e cuore di Piraino.", "Trentacinque anni passarono così, dal 1950 al 1985, lenti e pieni, a Piraino centro. Turi e Maria di Ficarra invecchiarono insieme, tra cimitero, bottega, messa, tressette, orto e nipoti d'estate. Ogni anno, il 12 aprile, festeggiavano l'anniversario di matrimonio del 1922 con una bottiglia di vino della cantina di Brooklyn che si erano portati dietro e che centellinavano. Maria diceva: Turiddu, siamo tornati nel 1950 e non ce ne siamo più andati. E Turi, guardando la Torre Saracena che guarda il mare dalla finestra di pietra, diceva: è questo il paradiso, Maria. Non lo sapevamo, ma era qua.", "Negli ultimi anni, Turi camminava più piano, con il bastone, ma voleva ancora aprire il cimitero del convento ogni mattina. Diceva: i morti mi aspettano, non posso farli aspettare. E andava, con Maria di Ficarra che lo accompagnava tenendolo a braccetto, per i vicoli di pietra di Piraino centro che conosceva a memoria, anche ad occhi chiusi, dal 1920 al 1985. La gente lo salutava: Turi Lamonica, l'americano di Piraino centro! E lui rideva: americano? Io sugnu di Piraino centro, sempre stato, anche quando ero a New Jork dal 1920 al 1950."]}, {roman: "VIII", title: "La fine e i figli — A Piraino per sempre — 1985", paragraphs: ["Turi Lamonica morì a Piraino centro, come aveva sempre sognato, una mattina di novembre del 1985, a ottantasette anni, nel suo letto di pietra, con la finestra aperta sulla Torre Saracena che guarda il mare. Era nato nel 1898, partito nel 1920 a ventidue anni, tornato nel 1950, vissuto altri trentacinque anni tra le pietre sue. Non fu una morte triste, fu una morte serena, come si addormenta un bambino dopo una giornata di lavoro nei campi sopra Piraino centro. La sera prima aveva giocato a tressette al bar, aveva vinto una partita, aveva detto: domani apru u cimiteru alle sette, come sempre. Ma alle sette non si svegliò. Maria di Ficarra gli teneva la mano e diceva: Turiddu, Turiddu.", "Il funerale fu tutto Piraino centro. La Chiesa Madre era piena, con gente venuta anche da Gliaca, da Fiumara di Piraino, da Salinà, da Leomandri, da Ficarra per Maria. Le campane suonarono a lungo, quel suono che Turi aveva sentito partire dalla Stazione di Gliaca di Piraino nel 1920 e che ora lo riaccompagnava nel 1985. Lo portarono a spalla per i vicoli di pietra del centro, passando davanti alla sua bottega di orologi, davanti al bar del tressette, davanti alla casa dove era nato nel 1898. E la Torre Saracena che guarda il mare lo guardava passare per l'ultima volta.", "Lo seppellirono al cimitero del convento, quello che aveva custodito per trentacinque anni dal 1950, accanto ai suoi vecchi del centro. Sulla lapide, Maria di Ficarra volle scrivere solo: Turi Lamonica — 1898-1985 — Turnai 'o me paisi — partito 1920. E sotto, più piccolo: Piraino centro — New York 1920-1950 — Piraino centro 1950-1985. Perché quella era stata la sua vita: un cerchio chiuso tra le pietre del centro e le onde gigantesche dell'Atlantico che nel 1950 avevano provato a fermarlo.", "I figli arrivarono tutti dall'America per seppellirlo a Piraino, come lui aveva chiesto. Antonino l'avvocato di Manhattan, con Jennifer e Anthony e Sofia, che piangevano in inglese e siciliano. Antonino disse al funerale, con voce rotta: mio padre mi ha insegnato che si può costruire un palazzo a New York ma le fondamenta restano a Piraino centro. Partì nel 1920 e tornò nel 1950, e ora lui è fondamenta di questo paese, di queste pietre.", "Rosa l'insegnante arrivò con Patrick l'irlandese e i suoi due figli, Michael e Anna. Portò le cucciddati che aveva fatto a Queens e le mise sulla tomba di suo padre. Disse: papà, i miei alunni a New York sanno dove è Piraino centro grazie a te, sanno dove è la Torre Saracena che guarda il mare, sanno che sei partito nel 1920. E ora lo sapranno per sempre, perché tu sei lì.", "Peppino il meccanico, Giuseppe detto Peppino, arrivò con Lisa e Jo-Jo, che aveva ormai vent'anni e le mani nere di grasso come suo nonno le aveva di calce. Peppino non parlò molto, mise solo un piccolo orologio aggiustato da Turi sulla lapide e disse: papà, questo segna ancora l'ora giusta, come mi hai insegnato tu nel 1950 quando siamo tornati. E tutti capirono, perché a Piraino centro gli orologi di Turi Lamonica non si fermano mai, nemmeno quando il custode non c'è più.", "Oggi, se andate a Piraino centro, trovate ancora la botteguccia di Turi Lamonica, chiusa ma con la scritta sbiadita: Si aggiusta tutto, tranne il tempo perso. Maria di Ficarra, la sua Maria, non resse molto alla sua mancanza. Dopo la morte di Turi nell'estate del 1985, si spense piano, nella loro casetta di pietra, tre anni dopo, nella primavera del 1988, tenendo stretta la foto del matrimonio di Brooklyn del 1922. L'hanno seppellita accanto a lui, al cimitero del convento che lui aveva custodito per trentacinque anni. E trovate, al cimitero del convento, le loro due tombe vicine, sempre pulite, con fiori freschi e qualche limone di Piraino centro sopra, gialli come l'oro della copertina di questo libro.", "E la storia dei figli continua. Antonino fa l'avvocato a New York, ma ha comprato la casa di Piraino centro e ogni estate ci porta i figli, che ormai parlano siciliano e raccontano che nonno partì nel 1920. Rosa insegna e ogni anno porta una classe di bambini americani a Piraino centro, a vedere la Torre Saracena che guarda il mare. Peppino ha aperto una succursale del suo garage a Patti, così sta sei mesi in America e sei mesi a Piraino centro, vicino alla loro casetta di pietra e alle due tombe al cimitero del convento.", "Così finisce la storia di Turi Lamonica, di Piraino centro, partito dalla Stazione di Gliaca di Piraino nel 1920 con una valigia di cartone legata con lo spago, trent'anni in America fino al 1950 con onde gigantesche, vissuto altri trentacinque anni dal 1950 al 1985 tra cimitero, orologi e limoni, morto sereno a ottantasette anni nel 1985 tra le sue pietre. Turnai 'o me paisi, finalmente, per sempre. Era il 1920 quando partì, era il 1985 quando tornò alla terra. E la Torre Saracena che guarda il mare, che lo ha visto partire nel 1920 e tornare nel 1950, lo guarda ancora, immobile, fedele, come Piraino centro sa essere."]}]; function Fg(e) {let t = [{kind: "cover"}], n = ["Piraino anni Venti non era cartolina, era rocca e fatica. Il paese stava aggrappato alla roccia come un nido di pietra, case di pietra a secco una sull'altra, vicoli torti dove non entrava il sole d'inverno. Non c'era luce elettrica, non c'era acqua in casa. L'acqua si andava a prendere al pozzo con le brocche di rame in testa, due viaggi al giorno, le donne con le ginocchia rotte dalla salita. Tutto intorno latifondo, ulivi e limoni dei signori. I gabelloti a cavallo contavano le giornate, e i braccianti tornavano la sera con due lire e fame vecchia. I bambini scalzi, con i piedi neri e screpolati, giocavano con un cerchio di ferro e un bastone, mentre i cani magri dormivano sulle soglie. La sera, le donne filavano a lume di petrolio, l'odore di petrolio entrava nelle case di pietra come preghiera povera, e fuori il vento della rocca faceva sbattere le persiane. A Piraino anni Venti si nasceva già stanchi, ma con gli occhi puliti verso il mare. U paisi era na rocca, ma era casa.", "A Piraino anni Venti la povertà non faceva rumore, pesava sulle spalle come un sacco bagnato. Si mangiava pane di crusca e ghianda, amaro che grattava la gola, con un filo d'olio quando Dio voleva, e qualche oliva nera contata. Le tasse del Regno mangiavano il poco rimasto, e l'inverno era lungo, con la legna contata e il freddo che entrava dalle fessure delle porte di pietra. Quando non bastava più nemmeno il pane amaro, si preparava la valigia di cartone legata con lo spago, la stessa di tutti, con due camicie stirate alla meglio, un santino della Madonna e l'indirizzo di un cugino scritto storto su un pezzo di carta. L'addio non era alla stazione, era sulla porta di pietra di casa: la matri che non piangeva per non far piangere, il patri con la mano sulla spalla che diceva: Va, figghiu miu, e non ti scurdari di unni sì. Poi a piedi fino a Gliaca, col cuore che batteva, treno a vapore sbuffante fino a Messina, poi Palermo, odore di carbone e di gente ammassata, e poi il porto. E poi il bastimento, venticinque giorni in stiva, ammucchiati come limoni, col vomito, col freddo, col rosario stretto in mano. Piraino restava lassù sulla rocca, piccolo come un pugno, ma dentro come una chiesa.", "Negli anni Venti partirono a migliaia dalla Sicilia, e Piraino diede i suoi figli migliori. La traversata era paura, ma l'arrivo era giudizio: Ellis Island, fila infinita, medici con la lampadina che ti guardavano gli occhi, la paura di essere respinto per una cicatrice, per il tracoma, e rimandato indietro dopo venticinque giorni di mare, con la vergogna addosso. Marchiati come dagos, i siciliani finivano nelle miniere di carbone del Pennsylvania, a spaccare pietre per le ferrovie, a portare cemento nei cieli di New York, con la schiena rotta e la testa alta. Cinque dollari ogni mese tornavano a Piraino, piegati dentro una lettera che arrivava dopo mesi, con francobollo americano: Cara mamma, sto bene, mangio, lavoro, non vi preoccupate, vi abbraccio. Bugie sante, scritte con mani spaccate dalla calce. Alcuni non tornarono mai, restarono sotto terra d'America. Altri tornarono vecchi, con la valigia di cartone e l'oro nascosto nella cintura, e dicevano solo: Turnai 'o me paisi. Questa prefazione è per loro, per i pirainesi partiti negli anni Venti, che hanno tenuto Piraino nel cuore come una pietra in tasca, e che ci hanno insegnato che partir
